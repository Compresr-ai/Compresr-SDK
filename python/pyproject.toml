[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compresr"
version = "2.9.2"
description = "Python SDK for Compresr - Intelligent prompt compression service"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Compresr Team", email = "founders@compresr.ai"}
]
keywords = ["llm", "compression", "ai", "openai", "gpt", "tokens", "cost-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
# Agents layer (engine + LLM providers + search tools) — `pip install compresr[agents]`.
agents = [
    "langchain>=1.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=1.0",
    "langchain-openai>=0.3",
    "langchain-google-genai>=4.0",
    "langchain-tavily>=0.1",
    "langchain-community>=0.3",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0,<0.16",
    "mypy>=1.0.0",
    "python-dotenv>=1.0.0",
]
# Genuine optional integrations outside the agents layer.
langgraph = [
    "langgraph>=0.2",
]
llamaindex = [
    "llama-index-core>=0.11",
]
litellm = [
    # The guardrail imports `fastapi` directly (via litellm.proxy.*), which is
    # only pulled in by the `[proxy]` extra. Without `[proxy]` users hit
    # ModuleNotFoundError: fastapi at import time.
    "litellm[proxy]>=1.79",
]
# Amazon Bedrock AgentCore web search (WebSearchTool.agentcore). Optional
# because it requires AWS gateway provisioning; a bare install still imports.
agentcore = [
    "mcp>=1.0",
    "nest-asyncio>=1.6",
]
# Hermes plugin: no extra deps, the Hermes runtime provides its modules in-process.
hermes = []
all = [
    "compresr[agents]",
    "langgraph>=0.2",
    "llama-index-core>=0.11",
    "litellm[proxy]>=1.79",
    "mcp>=1.0",
    "nest-asyncio>=1.6",
]
# Back-compat aliases — all resolve to `agents`.
langchain = ["compresr[agents]"]
agents-anthropic = ["compresr[agents]"]
agents-openai = ["compresr[agents]"]
agents-gemini = ["compresr[agents]"]
agents-tavily = ["compresr[agents]"]
agents-brave = ["compresr[agents]"]
agents-all = ["compresr[agents]"]

[project.urls]
Homepage = "https://compresr.ai"
Documentation = "https://compresr.ai/docs"
Repository = "https://github.com/Compresr-ai/Compresr-SDK"
Issues = "https://github.com/Compresr-ai/Compresr-SDK/issues"

[project.scripts]
compresr-sdk = "compresr.__main__:main"
compresr-litellm = "compresr.integrations.litellm.cli:main"
install-compresr-shim = "compresr.integrations.litellm.shim_installer:main"

# Hermes plugin discovery; inert outside a Hermes process and opt-in there.
[project.entry-points."hermes_agent.plugins"]
compresr = "compresr.integrations.hermes.plugin"

[tool.setuptools.packages.find]
# Autodiscover every `compresr` subpackage so newly added ones (e.g.
# `compresr.agents.research`) ship automatically. A previous hand-maintained
# `packages = [...]` allowlist silently dropped packages that weren't added to
# it by hand. The `compresr*` filter keeps sibling dirs (tests, tutorial,
# litellm_shim) out of the distribution.
where = ["."]
include = ["compresr*"]

[tool.setuptools.package-data]
compresr = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
# Pinned below requires-python to keep pyupgrade off the existing codebase.
target-version = "py39"
extend-exclude = ["tutorial", "logs"]

[tool.ruff.lint]
# Ruff's historical default set; pinned so an unpinned ruff can't drift CI.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: live API tests (require COMPRESR_API_KEY + provider keys)",
]
